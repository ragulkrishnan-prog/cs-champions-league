<title>CS Champions League 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg-dark:#050B1E;
  --bg-panel:#0A1530;
  --bg-panel-2:#0F1D42;
  --accent:#1D4ED8;
  --accent-light:#3E6FF0;
  --line:#1B2A54;
  --white:#F4F7FC;
  --muted:#8CA0C9;
  --muted-2:#5C6F99;
  --gold:#E8B923;
  --gold-dim:#6E5A18;
  --red:#E3432A;
  --qualify:#E8C468;
  --radius:14px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(180deg, rgba(4,9,26,0.55) 0%, rgba(4,9,26,0.30) 22%, rgba(4,9,26,0.42) 60%, rgba(4,9,26,0.7) 100%),
    url('assets/background.jpg') center 30%/cover no-repeat fixed;
  background-attachment:fixed;
  color:var(--white);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 90px),
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,255,255,0.05) 0%, transparent 70%);
  z-index:0;
}

.display{font-family:'Teko',sans-serif;font-weight:600;letter-spacing:0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}

#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 18px 80px;}

/* ---------- HEADER ---------- */
header.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 18px 16px;margin:0 -18px 0;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg, rgba(5,11,30,0.55) 0%, rgba(5,11,30,0.15) 100%);
}
header.top h1, header.top .eyebrow, header.top .pill{
  text-shadow:0 2px 10px rgba(0,0,0,0.65);
}
.brand{display:flex;align-items:center;gap:12px;}

.brand-text .eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.16em;
  text-transform:uppercase;color:var(--gold);opacity:0.9;
}
.brand-text h1{
  font-family:'Teko',sans-serif;font-weight:600;font-size:26px;line-height:1;margin:2px 0 0;letter-spacing:0.01em;
}
.header-right{display:flex;align-items:center;gap:10px;}
.pill{
  display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:100px;
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.06em;
  background:var(--bg-panel-2);border:1px solid var(--line);color:var(--muted);
}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(227,67,42,0.55);}
  70%{box-shadow:0 0 0 7px rgba(227,67,42,0);}
  100%{box-shadow:0 0 0 0 rgba(227,67,42,0);}
}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg-panel-2);
  color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s ease;
}
.icon-btn:hover{border-color:var(--accent-light);color:var(--gold);}

/* ---------- CATEGORY SWITCH ---------- */
.cat-switch{
  display:flex;gap:8px;margin:18px 0 4px;
}
.cat-btn{
  flex:1;font-family:'Teko',sans-serif;font-weight:600;font-size:18px;letter-spacing:0.03em;
  padding:11px 10px;border-radius:11px;border:1px solid var(--line);background:var(--bg-panel);
  color:var(--muted);cursor:pointer;text-align:center;transition:all .15s ease;
}
.cat-btn:hover{border-color:var(--accent-light);color:var(--white);}
.cat-btn.active{background:linear-gradient(155deg,var(--accent-light),var(--accent));color:#fff;border-color:var(--accent-light);box-shadow:0 6px 18px rgba(29,78,216,0.35);}

/* ---------- NAV ---------- */
nav.tabs{
  display:flex;gap:4px;margin:18px 0 26px;overflow-x:auto;padding-bottom:2px;border-bottom:1px solid var(--line);
}
nav.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;
  padding:10px 16px;background:none;border:none;color:var(--muted-2);cursor:pointer;white-space:nowrap;
  position:relative;transition:color .15s ease;text-shadow:0 1px 6px rgba(0,0,0,0.5);
}
.tab-btn:hover{color:var(--white);}
.tab-btn.active{color:var(--gold);}
.tab-btn.active::after{
  content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--gold);border-radius:2px;
}

.view{animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- LIVE HERO SCOREBOARD ---------- */
.scoreboard{
  background:linear-gradient(180deg,var(--bg-panel) 0%, var(--bg-panel-2) 100%);
  border:1px solid var(--line);border-radius:var(--radius);padding:26px 20px 0;position:relative;
  overflow:hidden;margin-bottom:14px;
}
.scoreboard::before{
  content:"";position:absolute;top:-40%;left:50%;transform:translateX(-50%);width:140%;height:200px;
  background:radial-gradient(ellipse, rgba(232,185,35,0.10), transparent 70%);pointer-events:none;
}
.sb-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;position:relative;z-index:1;}
.sb-status{
  font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;padding:5px 12px;
  border-radius:100px;text-transform:uppercase;
}
.sb-status.live{background:rgba(227,67,42,0.15);color:#ff6b52;border:1px solid rgba(227,67,42,0.4);}
.sb-status.scheduled{background:rgba(232,185,35,0.1);color:var(--gold);border:1px solid var(--gold-dim);}
.sb-status.finished{background:rgba(140,160,201,0.1);color:var(--muted);border:1px solid var(--line);}
.sb-court{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.06em;}

.sb-main{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding-bottom:20px;position:relative;z-index:1;}
.sb-team{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;}
.sb-team .badge{
  width:60px;height:60px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-family:'Teko',sans-serif;font-weight:700;font-size:26px;box-shadow:0 6px 20px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(255,255,255,0.08);
}
.sb-team .name{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;}
.sb-score{display:flex;align-items:center;gap:14px;font-family:'Teko',sans-serif;font-weight:700;font-size:64px;line-height:1;color:var(--white);}
.sb-score .sep{color:var(--muted-2);font-size:40px;}
.sb-minute{text-align:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);margin-top:6px;letter-spacing:0.06em;}

.ticker-wrap{border-top:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:9px 0;position:relative;z-index:1;}

  if(!kickoffAt) return '';

  return words.map(w=>w[0]).join('').slice(0,4).toUpperCase();
}

async function loadData(){
  try{
    const snap = await dbRef.once('value');
    const val = snap.val();
    if(val){
      DATA = val;
    } else {
      DATA = seedData();
      await dbRef.set(DATA);
    }
  } catch(e){
    DATA = seedData();
  }
  render();
  startLiveSync();
}

async function saveData(showSaved){
  DATA.updatedAt = Date.now();
  try{
    await dbRef.set(DATA);
    if(showSaved) flashToast();
  } catch(e){
    flashToast('Save failed — check connection');
  }
  render();
}

function flashToast(msg){
  const t = document.getElementById('toast');

  clearTimeout(window.__toastTimer);

  const table = {};
  teamsInCat(cat).forEach(t=> table[t.id] = { team:t, played:0, won:0, drawn:0, lost:0, gf:0, ga:0, pts:0 });
  matchesInCat(cat).forEach(m=>{
    if(m.status !== 'finished') return;
    const a = table[m.teamAId], b = table[m.teamBId];
    if(!a || !b) return;
    a.played++; b.played++;
    a.gf += m.scoreA; a.ga += m.scoreB;
    b.gf += m.scoreB; b.ga += m.scoreA;
    if(m.scoreA > m.scoreB){ a.won++; b.lost++; a.pts+=3; }
    else if(m.scoreA < m.scoreB){ b.won++; a.lost++; b.pts+=3; }
    else { a.drawn++; b.drawn++; a.pts+=1; b.pts+=1; }
  });
  return Object.values(table).sort((x,y)=>
    y.pts - x.pts || (y.gf-y.ga) - (x.gf-x.ga) || y.gf - x.gf
  );
}

function recentGoalsTicker(cat){
  const items = [];
  matchesInCat(cat).forEach(m=>{
    if(m.status==='live' || m.status==='finished'){
      m.goals.forEach(g=>{
        const scoringTeam = g.team === 'A' ? team(m.teamAId) : team(m.teamBId);
        items.push({ minute:g.minute, player:g.player, teamName: scoringTeam? scoringTeam.short:'' });
      });
    }
  });
  return items;
}

function renderLive(){
  const live = matchesInCat(currentCat).filter(m=>m.status==='live');
  const ticker = recentGoalsTicker(currentCat);
  let html = '';

  if(live.length===0){
    const next = matchesInCat(currentCat).filter(m=>m.status==='scheduled').sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time))[0];
    html += `<div class="scoreboard"><div class="no-live">
      <div class="display">NO ${catLabel(currentCat).toUpperCase()} MATCH LIVE RIGHT NOW</div>
      ${next ? `<p>Next up: ${team(next.teamAId).name} vs ${team(next.teamBId).name} — ${fmtDate(next.date).day} ${fmtDate(next.date).mon}, ${next.time} · ${next.court}</p>` : `<p>No fixtures scheduled yet — check back soon.</p>`}
    </div></div>`;
  } else {
    live.forEach(m=>{
      const a = team(m.teamAId), b = team(m.teamBId);
      html += `
      <div class="scoreboard">
        <div class="sb-top">
          <span class="sb-status live"><span class="dot-live" style="display:inline-block;margin-right:5px;"></span>LIVE</span>
          <span class="sb-court">${m.court}</span>

          </div>
          <div class="sb-team">
            <div class="badge" style="${badgeStyle(b.color)}">${b.short}</div>
            <div class="name">${b.name}</div>
          </div>
        </div>
        ${renderMatchTicker(m)}
      </div>`;
    });
  }

  html += `
  <div class="section-head"><h2>Recent Goals <span class="count">${ticker.length}</span></h2></div>
  ${ticker.length ? `<div class="ticker-wrap"><div class="ticker-track">${ticker.map(g=>`<span><b>⚽ ${g.player}</b> ${g.minute}' — ${g.teamName}</span>`).join('')}</div></div>` : `<div class="empty-ticker">No goals scored yet</div>`}

  return html;
}

function renderMatchTicker(m){
  if(!m.goals.length) return `<div class="empty-ticker">No goals yet — all to play for</div>`;
  const a = team(m.teamAId), b = team(m.teamBId);
  const items = m.goals.map(g=>{
    const t = g.team==='A'? a : b;
    return `<span><b>⚽ ${g.player}</b> ${g.minute}' (${t.short})</span>`;
  }).join('');
  return `<div class="ticker-wrap"><div class="ticker-track">${items}</div></div>`;
}

/* ============ EVENTS ============ */
function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentTab = btn.dataset.tab; render(); });
  });

  document.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ currentCat = btn.dataset.cat; render(); });
  });

  const adminIcon = document.getElementById('adminIconBtn');
  if(adminIcon) adminIcon.addEventListener('click', ()=>{ currentTab='admin'; render(); });

  document.querySelectorAll('[data-subtab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ adminSubtab = btn.dataset.subtab; render(); });
  });

  document.querySelectorAll('[data-team-toggle]').forEach(card=>{
    card.addEventListener('click', ()=>{
      const id = card.dataset.teamToggle;
      openTeamId = openTeamId===id ? null : id;
      render();
    });
  });

  const pinSubmit = document.getElementById('pinSubmit');
  if(pinSubmit){
    const doUnlock = ()=>{
      const val = document.getElementById('pinInput').value;
      if(val === ADMIN_PIN){ adminUnlocked = true; render(); }
      else { document.getElementById('pinErr').textContent = 'Incorrect password'; }
    };
    pinSubmit.addEventListener('click', doUnlock);
    document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doUnlock(); });
  }

  const lockBtn = document.getElementById('lockBtn');
  if(lockBtn) lockBtn.addEventListener('click', ()=>{ adminUnlocked=false; render(); });

  document.querySelectorAll('[data-score]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = DATA.matches.find(x=>x.id===btn.dataset.match);
      const delta = parseInt(btn.dataset.delta,10);
      if(btn.dataset.score==='A') m.scoreA = Math.max(0, m.scoreA+delta);
      else m.scoreB = Math.max(0, m.scoreB+delta);
      saveData(true);
    });
  });

  document.querySelectorAll('[data-field]').forEach(el=>{
    el.addEventListener('change', ()=>{
      const m = DATA.matches.find(x=>x.id===el.dataset.match);
      m[el.dataset.field] = el.value;
      if(el.dataset.field==='status' && el.value==='live' && !m.kickoffAt){
        m.kickoffAt = Date.now();
      }
      saveData(true);
    });
  });

  document.querySelectorAll('[data-start-timer]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = DATA.matches.find(x=>x.id===btn.dataset.startTimer);
      m.kickoffAt = Date.now();
      m.minute = '';
      m.status = 'live';
      flashToast('Live timer started');
      saveData(true);
    });
  });
  document.querySelectorAll('[data-resume-2h]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = DATA.matches.find(x=>x.id===btn.dataset.resume2h);
      m.kickoffAt = Date.now() - 45*60*1000;
      m.minute = '';
      m.status = 'live';
      flashToast('2nd half timer started');
      saveData(true);
    });
  });

  document.querySelectorAll('[data-add-goal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mid = btn.dataset.addGoal;
      const m = DATA.matches.find(x=>x.id===mid);
      const teamSel = document.querySelector(`[data-goal-team="${mid}"]`);
      const player = document.getElementById(`goalPlayer_${mid}`).value.trim();
      const minute = document.getElementById(`goalMin_${mid}`).value;
      if(!player || !minute){ flashToast('Enter player & minute'); return; }
      m.goals.push({ team:teamSel.value, player, minute: parseInt(minute,10) });
      m.goals.sort((a,b)=>a.minute-b.minute);
      if(teamSel.value==='A') m.scoreA++; else m.scoreB++;
      saveData(true);
    });
  });

  document.querySelectorAll('[data-remove-goal]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const mid = btn.dataset.removeGoal;
      const idx = parseInt(btn.dataset.goalIndex,10);
      const m = DATA.matches.find(x=>x.id===mid);
      const g = m.goals[idx];
      if(g.team==='A') m.scoreA = Math.max(0,m.scoreA-1); else m.scoreB = Math.max(0,m.scoreB-1);
      m.goals.splice(idx,1);
      saveData(true);
    });
  });

  const newMatchCat = document.getElementById('newMatchCat');
  if(newMatchCat){
    const populateTeamSelects = ()=>{
      const cat = newMatchCat.value;
      const opts = teamsInCat(cat).map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
      document.getElementById('newMatchA').innerHTML = opts;
      document.getElementById('newMatchB').innerHTML = opts;
      document.getElementById('newMatchB').selectedIndex = Math.min(1, teamsInCat(cat).length-1);
    };
    newMatchCat.addEventListener('change', populateTeamSelects);
    populateTeamSelects();
  }

  const addMatchBtn = document.getElementById('addMatchBtn');
  if(addMatchBtn){
    addMatchBtn.addEventListener('click', ()=>{
      const cat = document.getElementById('newMatchCat').value;
      const a = document.getElementById('newMatchA').value;
      const b = document.getElementById('newMatchB').value;
      const court = document.getElementById('newMatchCourt').value || 'Court 1';
      const date = document.getElementById('newMatchDate').value;
      const time = document.getElementById('newMatchTime').value;
      if(a===b){ flashToast('Pick two different teams'); return; }
      if(!date || !time){ flashToast('Set date & time'); return; }
      DATA.matches.push({ id:uid('m'), category:cat, teamAId:a, teamBId:b, date, time, court, status:'scheduled', scoreA:0, scoreB:0, minute:'', goals:[] });
      saveData(true);
    });
  }

  document.querySelectorAll('[data-delete-match]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      DATA.matches = DATA.matches.filter(m=>m.id!==btn.dataset.deleteMatch);
      saveData(true);
    });
  });

  const addTeamBtn = document.getElementById('addTeamBtn');
  if(addTeamBtn){
    addTeamBtn.addEventListener('click', ()=>{
      const cat = document.getElementById('newTeamCat').value;
      const name = document.getElementById('newTeamName').value.trim();
      let short = document.getElementById('newTeamShort').value.trim().toUpperCase();
      if(!name){ flashToast('Enter a team name'); return; }
      if(!short) short = shortCode(name);
      const color = TEAM_COLORS[DATA.teams.length % TEAM_COLORS.length];
      DATA.teams.push({ id:uid('t'), name, short, color, category:cat, players:[] });
      saveData(true);
    });
  }

  document.querySelectorAll('[data-add-player]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tid = btn.dataset.addPlayer;
      const t = team(tid);
      const name = document.getElementById(`newPlayerName_${tid}`).value.trim();
      const num = document.getElementById(`newPlayerNum_${tid}`).value;
      const pos = document.getElementById(`newPlayerPos_${tid}`).value;
      if(!name || !num){ flashToast('Enter name & number'); return; }
      t.players.push({ id:uid('p'), number:parseInt(num,10), name, position:pos });
      saveData(true);
    });
  });

  document.querySelectorAll('[data-remove-player]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const t = team(btn.dataset.removePlayer);
      t.players = t.players.filter(p=>p.id!==btn.dataset.playerId);
      saveData(true);
    });
  });
}

/* ============ LIVE SYNC (real-time, no polling needed) ============ */
function startLiveSync(){
  dbRef.on('value', (snap)=>{
    if(adminUnlocked) return; // admin edits locally until they hit Save
    const fresh = snap.val();
    if(fresh && fresh.updatedAt !== (DATA && DATA.updatedAt)){
      DATA = fresh;
      render();
    }
  });
}

/* ============ INIT ============ */
loadData();
</script>
